[workspace]
members = [
    "crates/ags-cli",
    "crates/task-card-validator",
    "crates/ags-governance-decision",
    "crates/workflow-sync-check",
    "crates/suite-doctor",
    "crates/bootstrap-dry-run",
    "crates/execution-policy",
    "crates/ags-workspace-facts",
    "crates/ags-task-contract",
    "crates/capability-registry",
    "crates/ags-evidence",
    "crates/ags-verification",
    "crates/runner",
    "crates/skill-governance",
    "crates/ags-mcp",
    "crates/ags-platform",
    "crates/ags-host-integration",
    "crates/ags-session",
    "crates/ags-capability-governance",
    "crates/ags-lifecycle",
    "crates/delivery-report-validator",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
