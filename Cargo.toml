[workspace]
members = [
    "crates/ags-platform",
    "crates/ags-workspace-facts",
    "crates/ags-host-integration",
    "crates/ags-capability-governance",
    "crates/ags-task-contract",
    "crates/ags-governance-decision",
    "crates/ags-session",
    "crates/ags-evidence",
    "crates/ags-verification",
    "crates/ags-lifecycle",
    "crates/ags-cli",
    "crates/ags-mcp",
]
resolver = "2"

[workspace.package]
version = "0.3.7"
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
