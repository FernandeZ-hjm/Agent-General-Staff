[workspace]
members = [
    "crates/ags-kernel",
    "crates/ags-task-contract",
    "crates/ags-cli",
    "crates/ags-mcp",
    "crates/ags-release",
]
resolver = "2"

[workspace.package]
version = "0.4.21"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.96.0"

[workspace.dependencies]
ags-kernel = { path = "crates/ags-kernel" }
ags-task-contract = { path = "crates/ags-task-contract" }
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
flate2 = "1"
junction = "2"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
