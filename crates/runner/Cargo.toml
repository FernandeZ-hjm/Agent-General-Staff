[package]
name = "runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AGS runner — gate-first task card execution planner"

[dependencies]
task-card-validator = { path = "../task-card-validator" }
execution-policy = { path = "../execution-policy" }
receipt = { package = "ags-evidence", path = "../ags-evidence" }
skill-resolver = { package = "ags-capability-governance", path = "../ags-capability-governance" }
request-governance = { package = "ags-governance-decision", path = "../ags-governance-decision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
