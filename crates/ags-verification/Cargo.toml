[package]
name = "ags-verification"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AGS verification core — structured check items, scoped verification, and machine-readable reports"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
ags-platform = { path = "../ags-platform" }
ags-governance-decision = { path = "../ags-governance-decision" }
ags-capability-governance = { path = "../ags-capability-governance" }
ags-workspace-facts = { path = "../ags-workspace-facts" }
ags-lifecycle = { path = "../ags-lifecycle" }
ags-session = { path = "../ags-session" }
ags-host-integration = { path = "../ags-host-integration" }

[dev-dependencies]
tempfile = "3"
