[package]
name = "ags-verification"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AGS verification core — structured check items, scoped verification, and machine-readable reports"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
request-governance = { package = "ags-governance-decision", path = "../ags-governance-decision" }
workflow-sync-check = { path = "../workflow-sync-check" }

[dev-dependencies]
tempfile = "3"
