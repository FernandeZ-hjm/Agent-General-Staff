[package]
name = "ags-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent Governance Suite unified CLI"

[[bin]]
name = "ags"
path = "src/main.rs"

[dependencies]
ags-control-plane = { path = "../ags-control-plane" }
ags-host-integration = { path = "../ags-host-integration" }
ags-session = { path = "../ags-session" }
ags-verification = { path = "../ags-verification" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
