[package]
name = "ags-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent Governance Suite unified CLI"

[[bin]]
name = "ags"
path = "src/main.rs"

[dependencies]
ags-platform = { path = "../ags-platform" }
ags-workspace-facts = { path = "../ags-workspace-facts" }
ags-capability-governance = { path = "../ags-capability-governance" }
ags-task-contract = { path = "../ags-task-contract" }
ags-governance-decision = { path = "../ags-governance-decision" }
ags-evidence = { path = "../ags-evidence" }
ags-verification = { path = "../ags-verification" }
ags-lifecycle = { path = "../ags-lifecycle" }
ags-host-integration = { path = "../ags-host-integration" }
ags-mcp = { path = "../ags-mcp" }
ags-session = { path = "../ags-session" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
libc = "0.2"
serde_yaml = "0.9"
tempfile = "3"
