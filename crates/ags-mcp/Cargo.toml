[package]
name = "ags-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AGS MCP Server — governance kernel exposed as MCP tools/resources/prompts over stdio"

[dependencies]
task-card-validator = { path = "../task-card-validator" }
request-governance = { package = "ags-governance-decision", path = "../ags-governance-decision" }
skill-resolver = { package = "ags-capability-governance", path = "../ags-capability-governance" }
execution-policy = { path = "../execution-policy" }
project-discovery = { package = "ags-workspace-facts", path = "../ags-workspace-facts" }
ags-verify = { package = "ags-verification", path = "../ags-verification" }
ags-onboarding = { package = "ags-lifecycle", path = "../ags-lifecycle" }
receipt = { package = "ags-evidence", path = "../ags-evidence" }
ags-session = { path = "../ags-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
getrandom = "0.4.2"
