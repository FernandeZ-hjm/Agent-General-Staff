[package]
name = "ags-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Workspace service, client sessions, preflight bindings, and one-shot leases for AGS"

[dependencies]
ags-platform = { path = "../ags-platform" }
ags-capability-governance = { path = "../ags-capability-governance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4.2"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
