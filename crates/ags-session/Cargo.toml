[package]
name = "ags-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Workspace service, client sessions, preflight bindings, and one-shot leases for AGS"

[dependencies]
ags-platform = { path = "../ags-platform" }
ags-capability-governance = { path = "../ags-capability-governance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.4.2"

[dev-dependencies]
tempfile = "3"
