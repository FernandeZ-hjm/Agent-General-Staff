name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AGS_WORKSPACE_IDLE_MS: "1000"

jobs:
  rust:
    name: Public source and release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify source semantics once
        run: cargo run -q -p ags-cli -- verify --scope local --format text

      - name: Test npm launcher once
        run: npm test --prefix packages/ags-mcp

      - name: Install cargo-deny
        run: |
          if command -v cargo-deny >/dev/null 2>&1; then
            cargo deny --version
          else
            cargo install cargo-deny --locked
          fi

      - name: Supply-chain audit
        run: cargo deny check

      - name: Verify public release boundary once
        run: ./target/release/ags verify --scope release --format text
