name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  public-gate:
    name: Unique public gate (contract v3, five crates)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Clippy once
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests once
        run: RUSTFLAGS="-D warnings" cargo test --locked --workspace
      - name: Governance check once (v3)
        shell: bash
        run: |
          report="$RUNNER_TEMP/governance.json"
          if ! cargo run -q --locked -p ags-cli -- check governance \
            --workspace . --format json > "$report"; then
            cat "$report"
            exit 1
          fi
      - name: Test all npm entrypoints once
        run: >-
          node --test
          packages/ags-launcher/test/launcher.test.js
          packages/ags-cli/test/launcher.test.js
          packages/ags-mcp/test/launcher.test.js
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi
      - name: Supply-chain audit once
        run: cargo deny check
      - name: Release build once
        run: cargo build --locked --release -p ags-cli -p ags-mcp -p ags-kernel -p ags-release
      - name: Structured verify commands once (v3)
        shell: bash
        run: |
          report="$RUNNER_TEMP/test-full.json"
          if ! cargo run -q --locked -p ags-cli -- test full \
            --workspace . > "$report"; then
            cat "$report"
            exit 1
          fi
