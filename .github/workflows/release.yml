name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
      - name: Consume the exact public CI VerificationBundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          evidence_dir="$RUNNER_TEMP/ci-evidence"
          mkdir -p "$evidence_dir"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 100 \
            --json conclusion,headSha,databaseId \
            --jq '[.[] | select(.headSha == env.GITHUB_SHA and .conclusion == "success")][0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name public-verification-evidence \
            --dir "$evidence_dir"
          chmod +x "$evidence_dir/ags-verifier"
          "$evidence_dir/ags-verifier" check bundle validate \
            --target . \
            --source-scope public-full \
            --bundle "$evidence_dir/verification-bundle.json" \
            --format json
      - name: Verify one aligned version
        shell: bash
        run: |
          ci_verifier="$RUNNER_TEMP/ci-evidence/ags-verifier"
          git fetch origin main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(git rev-parse "origin/main^{commit}")"
          test "$tag_commit" = "$main_commit"
          version="$("$ci_verifier" --version)"
          version="${version##* }"
          launcher_version="$(node -p "require('./packages/ags-launcher/package.json').version")"
          cli_version="$(node -p "require('./packages/ags-cli/package.json').version")"
          mcp_version="$(node -p "require('./packages/ags-mcp/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$launcher_version" = "$version"
          test "$cli_version" = "$version"
          test "$mcp_version" = "$version"
          grep -Fqx "## Release $version" RELEASE_NOTES.md
          test "$GITHUB_REPOSITORY" = "FernandeZ-hjm/Agent-General-Staff"
          ! grep -Eq 'name: "(gep|evomap)"|evolution_asset_recall|private-runtime' manifests/mcp-registry.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-release-plan
          path: ${{ runner.temp }}/ci-evidence/public-release-plan.json
          if-no-files-found: error

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: public-release-plan
          path: .
      - run: cargo build --release --locked --target ${{ matrix.target }} -p ags-cli
      - name: Package Unix asset
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="ags-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p stage/runtime
          cp "target/${{ matrix.target }}/release/ags" stage/ags
          "target/${{ matrix.target }}/release/ags" release stage-runtime \
            --plan public-release-plan.json \
            --source . \
            --target stage/runtime
          tar -C stage -czf "$asset" ags runtime
      - name: Package Windows asset
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $asset = "ags-v$version-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path stage/runtime | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ags.exe" stage/ags.exe
          & "target/${{ matrix.target }}/release/ags.exe" release stage-runtime `
            --plan public-release-plan.json `
            --source . `
            --target stage/runtime
          Compress-Archive -Path stage/* -DestinationPath $asset
      - name: Verify unpacked Unix asset and minimum user journey
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="ags-v${version}-${{ matrix.target }}.tar.gz"
          mkdir unpacked
          tar -xzf "$asset" -C unpacked
          test -x unpacked/ags
          test "$(unpacked/ags --version)" = "ags $version"
          AGS_SOURCE_ROOT="$PWD/unpacked/runtime" \
            unpacked/ags skill recommend --format json > unpacked/recommendations.json
          grep -Fq '"diagnosing-bugs"' unpacked/recommendations.json
          clean_home="$RUNNER_TEMP/ags-clean-home"
          mkdir -p "$clean_home"
          HOME="$clean_home" \
            AGS_HOME="$clean_home/.ags/runtime" \
            AGS_SOURCE_ROOT="$PWD/unpacked/runtime" \
            unpacked/ags setup --yes --lifecycle-hosts codex --format json \
            > unpacked/setup-one-host.json
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync("unpacked/setup-one-host.json", "utf8"));
            if (JSON.stringify(value.approved_lifecycle_hosts) !== JSON.stringify(["codex"])) process.exit(1);
          '
      - name: Verify unpacked Windows asset and minimum user journey
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $asset = "ags-v$version-${{ matrix.target }}.zip"
          Expand-Archive -Path $asset -DestinationPath unpacked
          $observed = & "unpacked/ags.exe" --version
          if ($LASTEXITCODE -ne 0 -or $observed -ne "ags $version") { throw "unpacked version smoke failed" }
          $env:AGS_SOURCE_ROOT = "$PWD/unpacked/runtime"
          $recommendations = & "unpacked/ags.exe" skill recommend --format json
          if ($LASTEXITCODE -ne 0 -or -not ($recommendations -match '"diagnosing-bugs"')) {
            throw "unpacked recommendation journey failed"
          }
          $cleanHome = Join-Path $env:RUNNER_TEMP "ags-clean-home"
          New-Item -ItemType Directory -Force -Path $cleanHome | Out-Null
          $env:HOME = $cleanHome
          $env:USERPROFILE = $cleanHome
          $env:AGS_HOME = Join-Path $cleanHome ".ags/runtime"
          $setupJson = & "unpacked/ags.exe" setup --yes --lifecycle-hosts codex --format json 2>&1
          $setupExitCode = $LASTEXITCODE
          if ($setupExitCode -ne 0) {
            $setupJson | ForEach-Object { Write-Host $_ }
            throw "unpacked one-host setup journey failed"
          }
          $setup = ($setupJson -join "`n") | ConvertFrom-Json
          if (@($setup.approved_lifecycle_hosts).Count -ne 1 -or $setup.approved_lifecycle_hosts[0] -ne "codex") {
            throw "unpacked one-host setup did not select exactly codex"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ags-${{ matrix.target }}
          path: ags-v*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ags-*
          merge-multiple: true
          path: dist
      - name: Stage reviewed catalog asset
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp manifests/third-party-capabilities.yaml "dist/ags-third-party-catalog-v${version}.yaml"
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ags-v* ags-third-party-catalog-v*.yaml > SHA256SUMS
      - name: Generate and verify signed release index
        env:
          AGS_RELEASE_VERSION: ${{ github.ref_name }}
          AGS_RELEASE_COMMIT: ${{ github.sha }}
          AGS_RELEASE_REPOSITORY: ${{ github.repository }}
          AGS_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.AGS_RELEASE_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          export AGS_RELEASE_VERSION="${AGS_RELEASE_VERSION#v}"
          node scripts/sign-release-index.mjs dist
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/ags-v*
            dist/ags-third-party-catalog-v*.yaml
            dist/SHA256SUMS
            dist/release-index.json
            dist/release-index.sig
      - name: Create release with binary assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --latest \
            --title "Agent Governance Suite $version Public Edition" \
            --generate-notes
