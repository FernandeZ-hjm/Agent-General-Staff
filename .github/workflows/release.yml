name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Tag points at an exact already-gated commit; version consistency only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git fetch origin main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(git rev-parse "origin/main^{commit}")"
          test "$tag_commit" = "$main_commit" || { echo "tag commit is not origin/main"; exit 1; }
          ci_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 100 \
            --json conclusion,headSha,databaseId \
            --jq '[.[] | select(.headSha == env.GITHUB_SHA and .conclusion == "success")][0].databaseId')"
          test -n "$ci_run_id" || { echo "no successful CI run for tag commit"; exit 1; }
          cargo_version="$(awk '/^\[workspace.package\]$/{p=1;next} /^\[/{p=0} p&&/^version = /{gsub(/version = |\"/,"");print;exit}' Cargo.toml)"
          test -n "$version" && test -n "$cargo_version"
          test "$version" = "$cargo_version" || { echo "tag v$version != Cargo version $cargo_version"; exit 1; }
          cli_version="$(node -p "require('./packages/ags-cli/package.json').version")"
          mcp_version="$(node -p "require('./packages/ags-mcp/package.json').version")"
          launcher_version="$(node -p "require('./packages/ags-launcher/package.json').version")"
          test "$version" = "$cli_version" || { echo "CLI package version mismatch"; exit 1; }
          test "$version" = "$mcp_version" || { echo "MCP package version mismatch"; exit 1; }
          test "$version" = "$launcher_version" || { echo "launcher package version mismatch"; exit 1; }
          grep -Fqx "## Release $version" RELEASE_NOTES.md

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p ags-cli -p ags-mcp -p ags-kernel -p ags-release
      - name: Verify Windows runtime semantics
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cargo test --locked --target ${{ matrix.target }} -p ags-task-contract
          if ($LASTEXITCODE -ne 0) { throw "Windows task-contract tests failed" }
          cargo test --locked --target ${{ matrix.target }} -p ags-kernel --test windows_links
          if ($LASTEXITCODE -ne 0) { throw "Windows link lifecycle tests failed" }
      - name: Package Unix asset
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="ags-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/ags" stage/ags
          cp "target/${{ matrix.target }}/release/ags-mcp" stage/ags-mcp
          cp "target/${{ matrix.target }}/release/ags-host" stage/ags-host
          cp "target/${{ matrix.target }}/release/ags-policy" stage/ags-policy
          cp "target/${{ matrix.target }}/release/ags-release" stage/ags-release
          mkdir -p stage/runtime
          cp -R ags-skills stage/runtime/ags-skills
          tar -C stage -czf "$asset" ags ags-mcp ags-host ags-policy ags-release runtime
      - name: Package Windows asset
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $asset = "ags-v$version-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ags.exe" stage/ags.exe
          Copy-Item "target/${{ matrix.target }}/release/ags-mcp.exe" stage/ags-mcp.exe
          Copy-Item "target/${{ matrix.target }}/release/ags-host.exe" stage/ags-host.exe
          Copy-Item "target/${{ matrix.target }}/release/ags-policy.exe" stage/ags-policy.exe
          Copy-Item "target/${{ matrix.target }}/release/ags-release.exe" stage/ags-release.exe
          New-Item -ItemType Directory -Force -Path stage/runtime | Out-Null
          Copy-Item -Recurse ags-skills stage/runtime/ags-skills
          Compress-Archive -Path stage/* -DestinationPath $asset
      - name: Verify unpacked Unix asset and minimum user journey
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="ags-v${version}-${{ matrix.target }}.tar.gz"
          mkdir unpacked
          tar -xzf "$asset" -C unpacked
          test -x unpacked/ags
          case "$(unpacked/ags --version)" in
            "ags v${version} (build "*) ;;
            *) echo "unpacked version smoke failed"; exit 1 ;;
          esac
          unpacked/ags schema --format json > unpacked/schema.json
          unpacked/ags setup --source-root unpacked > unpacked/setup.json
          node -e 'const v=JSON.parse(require("node:fs").readFileSync("unpacked/setup.json","utf8")); if(v.installed!==true||!Array.isArray(v.writes)) process.exit(1)'
          # minimal v3 journey: adopt a scratch workspace, register its CI
          # host through the sealed operation, then prove Doctor is healthy
          scratch="$RUNNER_TEMP/ags-scratch"
          mkdir -p "$scratch"
          unpacked/ags init --workspace "$scratch" --slug scratch > unpacked/init.txt
          action_ref="$(sed -n 's/.*ags apply \([0-9a-f]\{64\}\) --workspace.*/\1/p' unpacked/init.txt)"
          test -n "$action_ref"
          unpacked/ags apply "$action_ref" --workspace "$scratch" > unpacked/apply.json
          unpacked/ags govern host-register \
            --id github-actions \
            --surface cli \
            --workspace "$scratch" > unpacked/host-register.txt
          host_action_ref="$(sed -n 's/.*ags apply \([0-9a-f]\{64\}\) --workspace.*/\1/p' unpacked/host-register.txt)"
          test -n "$host_action_ref"
          unpacked/ags apply "$host_action_ref" --workspace "$scratch" > unpacked/host-apply.json
          unpacked/ags doctor --workspace "$scratch" > unpacked/doctor.json
          node -e 'const v=JSON.parse(require("node:fs").readFileSync("unpacked/doctor.json","utf8")); if(v.healthy!==true||v.core_healthy!==true) process.exit(1)'
      - name: Verify unpacked Windows asset and minimum user journey
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $asset = "ags-v$version-${{ matrix.target }}.zip"
          $isolatedHome = Join-Path $env:RUNNER_TEMP "ags-home"
          New-Item -ItemType Directory -Force -Path $isolatedHome | Out-Null
          $env:HOME = $isolatedHome
          $env:USERPROFILE = $isolatedHome
          Expand-Archive -Path $asset -DestinationPath unpacked
          foreach ($binary in @("ags.exe", "ags-mcp.exe", "ags-host.exe", "ags-policy.exe", "ags-release.exe")) {
            $binaryPath = Join-Path "unpacked" $binary
            if (-not (Test-Path $binaryPath)) { throw "unpacked $binary missing" }
            $observed = & $binaryPath --version
            if ($LASTEXITCODE -ne 0 -or $observed -notlike "*v$version*") { throw "unpacked $binary version smoke failed" }
          }
          if (-not (Test-Path "unpacked/runtime/ags-skills/ags-setup/SKILL.md")) { throw "unpacked v3 runtime profile missing" }
          $schemaJson = & "unpacked/ags.exe" schema --format json 2>&1
          if ($LASTEXITCODE -ne 0) {
            $schemaJson | ForEach-Object { Write-Host $_ }
            throw "unpacked schema read failed"
          }
          $sourceRoot = (Resolve-Path "unpacked").Path
          $setupJson = & "unpacked/ags.exe" setup --source-root $sourceRoot 2> unpacked/setup.stderr
          if ($LASTEXITCODE -ne 0) {
            Get-Content unpacked/setup.stderr | ForEach-Object { Write-Host $_ }
            throw "unpacked setup failed"
          }
          $setup = ($setupJson -join "`n") | ConvertFrom-Json
          if ($setup.installed -ne $true -or $null -eq $setup.writes) { throw "unpacked setup result is invalid" }

          $scratch = Join-Path $env:RUNNER_TEMP "ags-scratch"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $initText = (& "unpacked/ags.exe" init --workspace $scratch --slug scratch 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $initText; throw "unpacked init plan failed" }
          $initMatch = [regex]::Match($initText, 'ags apply ([0-9a-f]{64}) --workspace')
          if (-not $initMatch.Success) { throw "init action_ref missing" }
          & "unpacked/ags.exe" apply $initMatch.Groups[1].Value --workspace $scratch | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "unpacked init apply failed" }

          $hostText = (& "unpacked/ags.exe" govern host-register --id github-actions --surface cli --workspace $scratch 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { Write-Host $hostText; throw "unpacked host registration plan failed" }
          $hostMatch = [regex]::Match($hostText, 'ags apply ([0-9a-f]{64}) --workspace')
          if (-not $hostMatch.Success) { throw "host registration action_ref missing" }
          & "unpacked/ags.exe" apply $hostMatch.Groups[1].Value --workspace $scratch | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "unpacked host registration apply failed" }

          $doctorJson = & "unpacked/ags.exe" doctor --workspace $scratch 2> unpacked/doctor.stderr
          if ($LASTEXITCODE -ne 0) {
            Get-Content unpacked/doctor.stderr | ForEach-Object { Write-Host $_ }
            throw "unpacked doctor failed"
          }
          $doctor = ($doctorJson -join "`n") | ConvertFrom-Json
          if ($doctor.healthy -ne $true -or $doctor.core_healthy -ne $true) { throw "unpacked doctor is unhealthy" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ags-${{ matrix.target }}
          path: ags-v*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ags-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ags-v* > SHA256SUMS
      - name: Generate and verify signed release index
        env:
          AGS_RELEASE_VERSION: ${{ github.ref_name }}
          AGS_RELEASE_COMMIT: ${{ github.sha }}
          AGS_RELEASE_REPOSITORY: ${{ github.repository }}
          AGS_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.AGS_RELEASE_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          export AGS_RELEASE_VERSION="${AGS_RELEASE_VERSION#v}"
          node .github/scripts/sign-release-index.mjs dist
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/ags-v*
            dist/SHA256SUMS
            dist/release-index.json
            dist/release-index.sig
      - name: Create release with binary assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --latest \
            --title "Agent Governance Suite $version Public Edition" \
            --generate-notes
