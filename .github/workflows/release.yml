name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt
      - name: Verify one aligned version
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "ags-cli"))')"
          npm_version="$(node -p "require('./packages/ags-mcp/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$npm_version" = "$version"
          grep -Fqx "## Release $version" RELEASE_NOTES.md
          test "$GITHUB_REPOSITORY" = "FernandeZ-hjm/Agent-General-Staff"
          forbidden_pattern='name: "(g''ep|evo''map)"|evolution_asset_''recall|private-''runtime'
          ! grep -Eq "$forbidden_pattern" manifests/mcp-registry.yaml
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
        env:
          RUSTFLAGS: "-D warnings"
      - run: npm test --prefix packages/ags-mcp
      - run: cargo run -q -p ags-cli -- verify --scope release --format text

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p ags-cli
      - name: Package Unix asset
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="ags-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p stage/runtime/manifests stage/runtime/protocol
          cp "target/${{ matrix.target }}/release/ags" stage/ags
          cp manifests/{skills-registry,mcp-registry,onboarding-public,third-party-capabilities,skill-recommendations}.yaml stage/runtime/manifests/
          cp protocol/{agent-task-protocol,task-card-template,runtime-adapters,task-routing,project-profile,context-memory,cursor-skill-index}.md stage/runtime/protocol/
          tar -C stage -czf "$asset" ags runtime
      - name: Package Windows asset
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $asset = "ags-v$version-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path stage/runtime/manifests,stage/runtime/protocol | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ags.exe" stage/ags.exe
          Copy-Item manifests/skills-registry.yaml,manifests/mcp-registry.yaml,manifests/onboarding-public.yaml,manifests/third-party-capabilities.yaml,manifests/skill-recommendations.yaml stage/runtime/manifests/
          Copy-Item protocol/agent-task-protocol.md,protocol/task-card-template.md,protocol/runtime-adapters.md,protocol/task-routing.md,protocol/project-profile.md,protocol/context-memory.md,protocol/cursor-skill-index.md stage/runtime/protocol/
          Compress-Archive -Path stage/* -DestinationPath $asset
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ags-${{ matrix.target }}
          path: ags-v*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ags-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ags-v* > SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/ags-v*"
      - name: Create release with binary assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --latest \
            --title "Agent General Staff $version Public Edition" \
            --generate-notes
