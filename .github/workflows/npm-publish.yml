name: Publish npm launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact already-released AGS version
        required: true
        type: string

permissions:
  contents: read
  attestations: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.12.1
      - name: Pack and inspect npm entry payloads
        shell: bash
        run: |
          for package in ags-launcher ags-cli ags-mcp; do
            npm pack --dry-run --json "./packages/$package" > "$RUNNER_TEMP/$package-pack.json"
            test "$(jq 'length' "$RUNNER_TEMP/$package-pack.json")" -eq 1
          done
      - name: Verify package and release versions
        shell: bash
        run: |
          for package in ags-launcher ags-cli ags-mcp; do
            package_version="$(node -p "require('./packages/$package/package.json').version")"
            test "$package_version" = "${{ inputs.version }}"
          done
          test "$GITHUB_REPOSITORY" = "FernandeZ-hjm/Agent-General-Staff"
          tag="v${{ inputs.version }}"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          asset_names=( \
            "ags-${tag}-aarch64-apple-darwin.tar.gz" \
            "ags-${tag}-x86_64-apple-darwin.tar.gz" \
            "ags-${tag}-x86_64-unknown-linux-gnu.tar.gz" \
            "ags-${tag}-aarch64-unknown-linux-gnu.tar.gz" \
            "ags-${tag}-x86_64-pc-windows-msvc.zip" \
          )
          catalog_name="ags-third-party-catalog-${tag}.yaml"
          for name in "${asset_names[@]}" "$catalog_name" SHA256SUMS release-index.json release-index.sig
          do
            grep -Fqx "$name" <<<"$assets"
          done
          mkdir -p "$RUNNER_TEMP/ags-release-check"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ags-v*' \
            --pattern 'ags-third-party-catalog-v*.yaml' \
            --pattern SHA256SUMS \
            --pattern release-index.json \
            --pattern release-index.sig \
            --dir "$RUNNER_TEMP/ags-release-check"
          cd "$RUNNER_TEMP/ags-release-check"
          signer_workflow="${GITHUB_SERVER_URL#*://}/$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for name in "${asset_names[@]}"; do
            grep -Fq "  $name" SHA256SUMS
          done
          grep -Fq "  $catalog_name" SHA256SUMS
          sha256sum --check SHA256SUMS
          for name in "${asset_names[@]}"; do
            gh attestation verify "$name" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow"
          done
          gh attestation verify "$catalog_name" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow"
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          const directory = process.env.RUNNER_TEMP + "/ags-release-check";
          const indexBytes = fs.readFileSync(directory + "/release-index.json");
          const signature = Buffer.from(fs.readFileSync(directory + "/release-index.sig", "utf8").trim(), "base64");
          const publicKey = fs.readFileSync(process.env.GITHUB_WORKSPACE + "/packages/ags-launcher/release-signing-public.pem", "utf8");
          if (!crypto.verify(null, indexBytes, publicKey, signature)) process.exit(1);
          const index = JSON.parse(indexBytes);
          if (index.version !== process.env.INPUT_VERSION || index.tag !== `v${process.env.INPUT_VERSION}`) process.exit(1);
          const catalogName = `ags-third-party-catalog-v${process.env.INPUT_VERSION}.yaml`;
          const catalog = fs.readFileSync(directory + "/" + catalogName);
          if (index.catalog?.name !== catalogName || index.catalog.sha256 !== crypto.createHash("sha256").update(catalog).digest("hex")) process.exit(1);
          NODE
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
      - name: Publish shared launcher
        run: npm publish --provenance --access public
        working-directory: packages/ags-launcher
      - name: Publish CLI
        run: npm publish --provenance --access public
        working-directory: packages/ags-cli
      - name: Publish MCP
        run: npm publish --provenance --access public
        working-directory: packages/ags-mcp
