registry:
  schema_version: 2.0-layered-projection
  description: Static routing contains activated bodies only; recommendations are never installed or routable by declaration.
  catalog_manifest: manifests/third-party-capabilities.yaml
  installation_authority: machine-local InstalledSkillRecord
  activation_authority: machine-local ActivatedCapability after exact route verification
skills:
- name: ags-agents
  profile: required
  local_path: templates/command-skills/ags-agents
  routing:
    route_state: not-routable
    routing_surface: host_command
    invoke_hint: ags agents scan
    intent_tags:
    - ags-host-management
    - ags-agent-scan
    capability_group:
    - ags-governance-ops
    upstream_group: suite-local
    examples:
      positive:
      - 检查本机 Agent 宿主和 AGS MCP 注册状态
      negative:
      - 让其他 Agent 并行执行代码任务
- name: ags-doctor
  profile: required
  local_path: templates/command-skills/ags-doctor
  routing:
    route_state: not-routable
    routing_surface: host_command
    invoke_hint: ags doctor --target .
    intent_tags:
    - ags-doctor
    - ags-health-check
    capability_group:
    - ags-governance-ops
    upstream_group: suite-local
    examples:
      positive:
      - 检查当前项目的 AGS 健康状态
      negative:
      - 诊断项目代码里的业务 bug
- name: ags-init
  profile: required
  local_path: templates/command-skills/ags-init
  routing:
    route_state: not-routable
    routing_surface: host_command
    invoke_hint: ags init --target .
    intent_tags:
    - ags-project-init
    - ags-project-onboarding
    capability_group:
    - ags-governance-ops
    upstream_group: suite-local
    examples:
      positive:
      - 把当前项目初始化为 AGS 纳管项目
      negative:
      - 初始化本机 AGS runtime
- name: ags-setup
  profile: required
  local_path: templates/command-skills/ags-setup
  routing:
    route_state: not-routable
    routing_surface: host_command
    invoke_hint: ags setup --yes --force
    intent_tags:
    - ags-machine-setup
    - ags-runtime-upgrade
    capability_group:
    - ags-governance-ops
    upstream_group: suite-local
    examples:
      positive:
      - 初始化或升级本机 AGS runtime
      negative:
      - 初始化当前项目的 AGS 协议文件
- name: ags-skill
  profile: required
  local_path: templates/command-skills/ags-skill
  routing:
    route_state: routable
    routing_surface: skill_target
    intent_tags:
    - skill-adoption
    - third-party-skill
    - skill-index
    - cross-host-skill
    scope_tags:
    - AGS 纳管 Skill
    - 第三方能力接入 AGS
    - GitHub Skill
    - 给 Skill 加索引
    - 跨宿主可见
    - 中文自然语言唤醒
    - adopt skill
    - third-party skill
    mutation_surface: local-write
    requires_auth: false
    cost_class: free
    invoke_hint: '[skill: ags-skill]'
    route_priority: 70
    capability_group:
    - ags-governance-ops
    upstream_group: suite-local
    examples:
      positive:
      - 用 AGS 纳管这个 Skill
      - 下载并纳管这个 GitHub Skill
      - 让这个 Skill 在 Codex 和 Claude 都能用
      negative:
      - 直接运行这个 Skill 帮我完成设计
      - 解释一下 Skill 是什么
      - 不用 AGS 直接执行第三方安装脚本
