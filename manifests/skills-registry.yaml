# Internal playbooks are stable entrypoints of one host-visible parent. They are
# routing metadata only: never install, expose, or invoke them as standalone
# skills. The Rust snapshot compiler projects routable entries into the parent
# SkillCard and ActiveSkill allowlist.
route_targets:
  - name: brainstorming
    description: Conversational resolution of explicit brainstorms or unresolved system architecture
    routing:
      route_state: routable
      parent: { kind: skill, name: superpowers }
      entrypoint: { kind: playbook, name: brainstorming }
      intent_tags: [brainstorm, system-architecture]
      scope_tags: ["*"]
      mutation_surface: read-only
      requires_auth: false
      cost_class: free
      invoke_hint: "[skill: superpowers]"
      route_priority: 40
      capability_group: [engineering-process]
      upstream_group: "obra/superpowers:brainstorming"
      examples:
        positive: ["帮我 brainstorm 一个方案", "设计跨 MCP、CLI、Vault 的新架构，明确架构边界"]
        negative: ["设计一个登录功能", "按已确认方案开始实现", "解释一下什么是系统架构"]

  - name: dispatching-parallel-agents
    description: Dispatch independent tasks to parallel agents
    routing:
      route_state: not-routable
      parent: { kind: skill, name: superpowers }
      entrypoint: { kind: playbook, name: dispatching-parallel-agents }
      intent_tags: [parallel-agents, delegate, fanout]
      scope_tags: ["*"]
      mutation_surface: read-only
      requires_auth: false
      cost_class: free
      invoke_hint: "[skill: superpowers]"
      route_priority: 55
      capability_group: [engineering-process]
      upstream_group: "obra/superpowers:dispatching-parallel-agents"

  - name: executing-plans
    description: Execute an approved written implementation plan
    routing:
      route_state: routable
      parent: { kind: skill, name: superpowers }
      entrypoint: { kind: playbook, name: executing-plans }
      intent_tags: [execute-plan]
      scope_tags: ["*"]
      mutation_surface: local-write
