# Each tree contributes Cargo.toml plus every file below src/ and tests/. The
# twelve roots are validated exactly; adding a thirteenth crate cannot silently
# enter the public payload.
crate_trees:
  - root: crates/ags-platform
  - root: crates/ags-workspace-facts
  - root: crates/ags-host-integration
  - root: crates/ags-capability-governance
    exclude:
      - src/adoption/
  - root: crates/ags-task-contract
  - root: crates/ags-governance-decision
  - root: crates/ags-session
  - root: crates/ags-evidence
  - root: crates/ags-verification
    exclude:
      - src/doctor/checks/evolver_hooks.rs
      - src/doctor/checks/proxy.rs
      - src/doctor/checks/templates.rs
  - root: crates/ags-lifecycle
  - root: crates/ags-cli
    exclude:
      - src/skill/adoption.rs
  - root: crates/ags-mcp
    exclude:
      - src/resources/evolver_boundary.md

