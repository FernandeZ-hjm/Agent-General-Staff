  - id: claude-mem-mcp
    kind: mcp
    name: Claude-Mem MCP
    profiles: [private]
    required: false
    tier: memory
    purpose: Search locally stored Claude-Mem observations.
    risk: medium
    source:
      manager: github-release
      version: "13.12.4"
      repository: "https://github.com/thedotmack/claude-mem"
      license: Apache-2.0
    install:
      strategy: external-manager
      depends_on: [claude-mem-hooks]
    routing:
      route_state: routable
      invoke_hint: "claude-mem MCP search"
      intent_tags: [memory-search, previous-session, continuity]
      positive_examples:
        - "找一下上次会话里我们为什么这样设计"
      negative_examples:
        - "读取当前仓库的任务记忆文件"
    mcp:
      server_name: "plugin:claude-mem:mcp-search"
      command: plugin-managed
      args: []

  - id: claude-mem-hooks
    kind: hook
    name: Claude-Mem Host Hooks
    profiles: [private]
    required: false
    tier: memory
    purpose: Bind Claude-Mem capture and lifecycle handlers to Claude Code events.
    risk: high
    source:
      manager: github-release
      version: "13.12.4"
      repository: "https://github.com/thedotmack/claude-mem"
      license: Apache-2.0
    install:
      strategy: external-manager
    routing:
      route_state: not-routable
    hook:
      host: claude-code
      events: [Setup, SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop]
      config_glob: "$HOME/.claude/plugins/cache/thedotmack/claude-mem/*/hooks/hooks.json"
      managed_by: "Claude Code plugin manager"
      health_probe: "plugin manifest exists and every declared event has a handler"

