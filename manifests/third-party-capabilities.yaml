# Reviewed static third-party capability manifest.
#
# This is discovery metadata, not an instruction script. AGS accepts only the
# closed install strategies implemented in Rust, pins every npm/git payload,
# and binds apply to the reviewed plan hash.

schema_version: "1.0"
principle: >
  Read the newest reviewed catalog from GitHub when available, validate it,
  freeze the returned content hash in the plan, and apply only one exact,
  explicitly confirmed action. Offline use falls back to the bundled snapshot
  and reports that provenance.

capabilities:
  - id: codegraph-cli
    kind: cli
    name: CodeGraph CLI
    profiles: [public, private]
    required: true
    tier: core
    purpose: Build and inspect the local code knowledge graph.
    risk: medium
    source:
      manager: npm
      package: "@colbymchenry/codegraph"
      version: "1.5.0"
      revision: "ea72e1b190921232aa7bd02e96bef5bbe4fe0ab6"
      integrity: "sha512-/l1JMVOQ9WGQLrc/IIuAg7Igr944t79/oNCJTcnGkYtIeQx2XFIqI0ho+9Les/Yu4zKfmPU17hIUshD6yP1fKw=="
      repository: "https://github.com/colbymchenry/codegraph"
      license: MIT
    install:
      strategy: npm-global
      command: codegraph
    routing:
      route_state: not-routable

  - id: codegraph
    kind: mcp
    name: CodeGraph MCP
    profiles: [public, private]
    required: true
    tier: core
    purpose: Resolve symbols, flows, callers, dependencies, and change impact from the local index.
    risk: medium
    source:
      manager: npm
      package: "@colbymchenry/codegraph"
      version: "1.5.0"
      revision: "ea72e1b190921232aa7bd02e96bef5bbe4fe0ab6"
      integrity: "sha512-/l1JMVOQ9WGQLrc/IIuAg7Igr944t79/oNCJTcnGkYtIeQx2XFIqI0ho+9Les/Yu4zKfmPU17hIUshD6yP1fKw=="
      repository: "https://github.com/colbymchenry/codegraph"
      license: MIT
    install:
      strategy: host-registrar
      depends_on: [codegraph-cli]
    routing:
      route_state: routable
      invoke_hint: "codegraph MCP"
      intent_tags: [code-intelligence, symbol-search, call-flow, change-impact]
      positive_examples:
        - "这个函数是怎么一路调用到写入层的？"
        - "改这个模块会影响哪些调用方？"
      negative_examples:
        - "帮我修改这个函数"
        - "查一下 React 最新文档"
    mcp:
      server_name: codegraph
      command: codegraph
      args: [serve, --mcp]

  - id: context7
    kind: mcp
    name: Context7
    profiles: [public, private]
    required: false
    tier: optional
    purpose: Retrieve current version-aware library documentation.
    risk: low
    source:
      manager: npm
      package: "@upstash/context7-mcp"
      version: "3.2.4"
      integrity: "sha512-w2Vg6MkF4Qojp8X1fdmJ6NrjZ8Ip/9lflybtqfDKaqOsUV9iVaXeRbyGTqARdn1O8teIPm7Bt+nfVqFiUcZvjQ=="
      repository: "https://github.com/upstash/context7"
      license: MIT
    install:
      strategy: host-registrar
    routing:
      route_state: routable
      invoke_hint: "context7 MCP (resolve-library-id + get-library-docs)"
      intent_tags: [docs-lookup, library-reference]
      positive_examples:
        - "查一下这个库的最新文档"
      negative_examples:
        - "把这个文档发邮件给张三"
    mcp:
      server_name: context7
      command: npx
      args: [-y, "@upstash/context7-mcp@3.2.4"]

