      integrity: "sha512-xsyUkGS6WsMmxiVHG7Qpl/U8vmi5qoZterAprAMBYQ0/lA5kMjUv5NL2pfDv/Krp2frQme/OtRjD5+jlEw0RPg=="
      repository: "https://github.com/larksuite/cli"
      license: MIT
    install:
      strategy: external-manager
      command: lark-cli
    routing:
      route_state: routable
      invoke_hint: "lark-cli through one exact governed Lark skill"
      intent_tags: [lark, feishu, collaboration]
