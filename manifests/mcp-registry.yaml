# MCP Registry (Private Edition)
# Source-of-truth index for suite-reviewed MCP servers.
#
# MCP servers are external capabilities. This registry records whether they are
# allowed, installed, and how they may be updated. It does not store secrets.
#
# ── Structural layers ──
#
#   suite_interfaces:  AGS self — host initialization adapter. NOT governed objects.
#                      AGS is the governance authority; it is not in the mcps: list.
#
#   mcps:              Governed third-party MCP servers. Reviewed and registered
#                      by AGS governance. Each entry has a current status, trust
#                      level, risk assessment, and allowed/denied authority rules.

schema_version: "1.0"
registry:
  version: "1.0.0"
  description: >
    Private MCP registry for Agent Governance Suite. suite_interfaces lists AGS
    own host adapters (not governed). mcps lists governed third-party MCP servers
    that must not be copied into global-skills/.
  default_policy: "deny_by_default"
  update_policy: "pin_version_manual_review_no_latest"

# ═══════════════════════════════════════════════════════════════════════════════
# Suite Interfaces — AGS self, NOT governed third-party MCPs
# ═══════════════════════════════════════════════════════════════════════════════

suite_interfaces:
  - name: "ags"
    role: "host_initialization_adapter"
    governed: false
    category: "governance_kernel"
    trust_level: "suite_canonical"
    description: >
      AGS MCP Server — host initialization adapter and mandatory governance
      interface over MCP stdio. Provides 9 governance tools, 8 protocol
      resources, and 4 governance prompts. AGS is the governance authority;
      it is NOT a governed third-party MCP. AGS MCP does NOT proxy, wrap,
      or broker EvoMap MCP calls. ags_route_request and all resources are
      read-only; ags_apply_action is the sole effectful MCP tool.
    package:
      manager: "cargo"
      name: "ags-mcp"
      version: "0.4.1"
      repository: "private — this repository"
      license: "GPL-3.0-only"
    install:
      transport: "stdio"
      command: "ags"
      args:
        - "mcp"
        - "serve"
        - "--transport"
        - "stdio"
      installed_clients:
        - "codex"
        - "claude-code"
        - "omp"
      not_installed_clients:
        # Tencent Agent host family (WorkBuddy, CodeBuddy-Code) and Cursor are
        # recognized hosts but not wired by default. tencent-agent is the
        # umbrella host id; workbuddy/codebuddy-code are its clients.
        - "cursor"
        - "tencent-agent"
        - "workbuddy"
        - "codebuddy-code"
      local_config_refs:
        - "private: crates/ags-mcp/"
        - "cli: ags mcp serve --transport stdio"
    authority:
      allowed:
        - "Run AGS governance preflight — mandatory first call for all AGS scenarios."
        - "Check protocol status, export agent instructions, validate task cards."
        - "Assess the public onboarding profile and hold one-shot per-item bootstrap actions."
        - "Resolve execution policy for validated task cards."
        - "Return read-only guidance for the fixed local verification action; actual verification runs only through ags_apply_action."
        - "Validate a typed host route proposal and return a read-only RouteResolution."
        - "Apply one server-held fixed action through a connection-bound, one-shot DecisionLease."
        - "Return the preflight-bound ags://capabilities/current-host resource."
        - "Return AGS protocol resources and governance prompts."
      denied:
        - "Write files, install hooks, or modify configuration outside ags_apply_action's closed fixed-action mappings."
        - "Proxy, wrap, or broker EvoMap MCP calls."
        - "Decide task level, execution authority, review gate, or verification gate — these are already encoded in AGS protocol; the tools only enforce."
        - "Read or write real tokens, node_secret, or ~/.evolver/settings.json."
        - "Modify stable/public worktree."
        - "Change AGS lifecycle/gate semantics."
    initialization_gate:
      mandatory: true
      entry_tool: "ags_preflight"
      cli_fallback: "ags session preflight --for <agent>"
      evidence_format: "AGS preflight: MCP|CLI, agent=<agent>, status=<ok|failed|fallback>"
      rule: >
        In any AGS scenario, the host MUST call ags_preflight (or CLI fallback)
        before invoking any other AGS tool. A failed project-integration
        preflight may establish a restricted bootstrap_required binding where
        only ags_onboarding_plan and ags_apply_action are allowed. All ordinary tools
        (ags_route_request, ags_apply_action, ags_task_validate,
        ags_policy_resolve) require preflight to have completed
        first. A new preflight invalidates every held DecisionLease.
        Hosts should reject calls to these tools before preflight.
    surfaces:
      tools:
        ags_route_request:
          mutation_surface: read-only
          input: typed_host_route_proposal
          process_launch: forbidden
          filesystem_write: forbidden
        ags_apply_action:
          mutation_surface: effectful
          input: decision_lease_and_action_reference_only
          arbitrary_argv: forbidden
          replay: forbidden
      resources:
        ags://capabilities/current-host:
          mutation_surface: read-only
          binding: preflight_host_and_target
    boundary:
      evomap: "parallel_peer_not_brokered"
      evomap_rule: >
        AGS MCP and EvoMap MCP are parallel peers. Hosts call both independently.
        AGS is the governance authority (lifecycle, gates, task level, permission
        mode, review gate, verification gate, release boundary). EvoMap provides
        advisory method recall during solution formation only. AGS MCP does NOT
        proxy, wrap, or broker EvoMap MCP calls. If EvoMap output conflicts with
        AGS protocol or gates, AGS always wins.
    risk:
      level: "low"
      findings:
        - "Runs as a local stdio process with same user privileges as the host."
        - "ags_apply_action can invoke only fixed AGS CLI mappings or append a controlled skill outcome."
        - "No external network calls — all tool implementations are local."
      mitigations:
        - "All mutation is isolated to ags_apply_action and guarded by a one-shot connection-local DecisionLease."
        - "ags_route_request starts no process and writes no file."
        - "Stdio transport only in v1 — no network exposure."
        - "No secret handling — tools do not read tokens, credentials, or keychain."
        - "EvoMap boundary is enforced in code — no proxy or broker paths exist."

# ═══════════════════════════════════════════════════════════════════════════════
# Governed MCPs — third-party, registered and managed by AGS governance
# ═══════════════════════════════════════════════════════════════════════════════

mcps:
  - name: "context7"
    profile: "optional"
    status: "active"
    category: "documentation_context"
    trust_level: "reviewed_external"
    routing:
      route_state: routable
      intent_tags: [docs-lookup, library-reference]
      scope_tags: ["*"]
      mutation_surface: read-only
      requires_auth: false
      cost_class: network
      invoke_hint: "context7 MCP (resolve-library-id + get-library-docs)"
      route_priority: 30
      examples:
        positive:
          - "how do I use the X library API"
          - "查一下这个库的最新文档"
        # Semantic-selection example only: a mail/messaging request that mentions
        # a doc must NOT select context7. The host evaluates this from full
        # conversation context; AGS has no demand classifier or priority fallback.
        negative:
          - "把这个文档发邮件给张三"
          - "send an email with the doc"
          - "发飞书消息"
    package:
      manager: "npm"
      name: "@upstash/context7-mcp"
      version: "3.2.4"
      integrity: "sha512-w2Vg6MkF4Qojp8X1fdmJ6NrjZ8Ip/9lflybtqfDKaqOsUV9iVaXeRbyGTqARdn1O8teIPm7Bt+nfVqFiUcZvjQ=="
      repository: "https://github.com/upstash/context7"
      license: "MIT"
    install:
      transport: "stdio"
      command: "npx"
      args:
        - "-y"
        - "@upstash/context7-mcp@3.2.4"
      installed_clients:
        - "codex"
      not_installed_clients:
        - "claude-code"
        - "cursor"
      local_config_refs:
        - "codex:~/.codex/config.toml"
    authority:
      allowed:
        - "Fetch version-aware library documentation."
        - "Return code examples from Context7 documentation corpus."
      denied:
        - "Read or write local filesystem."
        - "Access databases, secrets, keychains, SSH keys, or credentials."
        - "Override AGS protocol, task-card, release, or review-gate authority."
        - "Install or update packages without explicit human approval."
    risk:
      level: "low"
      findings:
        - "Runs local npm package through stdio with Codex user privileges."
        - "External documentation corpus may be incomplete or stale."
        - "Supporting backend, parsing, and crawling components are external to this repository."
      mitigations:
        - "Pin exact package version; do not use @latest."
        - "Treat Context7 output as advisory documentation context, not protocol authority."
        - "Require manual review before version bumps or enabling additional clients."

  - name: "gep"
    routing:
      route_state: not-routable
      capability_group: [method-recall]
      upstream_group: "evomap"
    profile: "optional"
    status: "active"
    category: "evolution_asset_recall"
    trust_level: "reviewed_external"
    protocol:
      name: "gep-a2a"
      version: "1.0.0"
      schema_version: "1.8.0"
      hub_url: "https://evomap.ai"
      observed_mode: "remote"
    package:
      manager: "npm"
      name: "@evomap/evolver"
      version: "protocol-gep-a2a-1.0.0-schema-1.8.0"
      integrity: "not_captured_existing_install"
      repository: "https://github.com/EvoMap/evolver"
      license: "not_recorded"
    install:
      transport: "mcp"
      command: "configured-client-mcp"
      args: []
      installed_clients:
        - "codex"
        - "claude-code"
      not_installed_clients:
        - "cursor"
      local_config_refs:
        - "codex:mcp__gep__ active in current session"
        - "claude-code:user-scope gep MCP entry"
    authority:
      allowed:
        - "Return GEP protocol metadata for drift detection."
        - "Search and list explicitly configured local GEP or skill assets."
        - "Search and list EvoMap Hub assets as advisory external recall."
        - "Run pre-solution evolution recall for Genes, Capsules, Skills, and method patterns."
        - "Return source-tagged asset candidates with local, hub, or bundled provenance."
        - "Submit validation reports only when explicitly authorized by the user or task card."
      denied:
        - "Read arbitrary local filesystem paths outside configured GEP or skill asset indexes."
        - "Write project files, AGS memory, task cards, delivery reports, receipts, or verification results."
        - "Install local Genes, Capsules, Skills, MCPs, or packages without explicit human approval."
        - "Publish, revoke, or submit EvoMap assets without explicit human approval."
        - "Override AGS protocol, project memory, task-card, execution-policy, release, review-gate, or verification authority."
        - "Treat Hub or community assets as trusted project facts."
    retrieval_policy:
      default_sources:
        - "local"
        - "hub"
      ranking:
        - "Prefer AGS project memory, task evidence, and local user-owned assets over Hub assets."
        - "Use Hub verified or featured assets as supplemental method recall."
        - "Use ordinary community assets only as low-trust advisory references."
      required_result_fields:
        - "source"
        - "type"
        - "id"
        - "summary"
        - "provenance"
        - "trust"
        - "why_selected"
    risk:
      level: "medium"
      findings:
        - "Remote mode can query EvoMap Hub and may return community-provided assets."
        - "Local asset listing may expose names or summaries of user-owned skills or GEP assets to the parent agent."
        - "Install, publish, revoke, and validation-report tools can mutate local or Hub state if called."
        - "Hub assets may be stale, incomplete, malicious, or misaligned with AGS boundaries."
      mitigations:
        - "Keep GEP as advisory recall only; AGS remains the authority layer."
        - "Require source, trust, and provenance fields in recalled asset summaries."
        - "Require explicit human approval before install, publish, revoke, or validation-report submission."
        - "Do not send secrets, private task archives, receipts, or full project memory to Hub search."
        - "Review and pin every version update in this registry."

  # Private/stable policy only.  Public-full has a separate allowlist and must
  # never project this hosted service, its account state, or host registration.
  - name: "evomap"
    profile: "optional"
    status: "active"
    category: "hosted_evolution_hub"
    trust_level: "reviewed_external"
    public_projection: "excluded"
    routing:
      route_state: routable
      intent_tags: [evomap, gep, gene, capsule, evolution-event, gdi, asset-health, lineage, community-recall, bounty-evaluation, reputation, credits, premium-biology]
      scope_tags: [evolution-assets, community-methods, evomap-account]
      mutation_surface: external-write
      requires_auth: true
      cost_class: paid
      invoke_hint: "Official EvoMap MCP: local assets use gep/evolver_proxy first; use evomap only for explicit Hub recall, community search, outcome recording, or evolution planning."
      route_priority: 30
      examples:
        positive:
          - "查 EvoMap 有没有类似 Gene 或 Capsule"
          - "看看这个资产的 GDI 和血缘情况"
          - "找匹配我们能力的悬赏，先评估能不能做"
          - "在 EvoMap 社区召回可复用经验"
        negative:
          - "自动进化并发布所有资产"
          - "不经确认就领取或提交悬赏"
          - "把本地业务证据和私有记忆全部上传"
    package:
      manager: "hosted-mcp"
      name: "EvoMap Remote MCP"
      version: "hosted-remote-mcp"
      integrity: "not_applicable_hosted_service"
      repository: "https://evomap.ai/learn/mcp-integration"
      license: "not_recorded"
    install:
      transport: "streamable-http"
      command: "https://evomap.ai/mcp"
      args: []
      installed_clients:
        - "codex"
        - "claude-code"
      not_installed_clients:
        - "cursor"
        - "omp"
    authority:
      allowed:
        - "Search EvoMap community Genes and Capsules as advisory external recall when explicitly requested."
        - "Recall Hub evolution memory, request an evolution plan, or record an outcome only after the user approves the specific paid operation."
        - "Return source-tagged community candidates, account-level asset metadata, and advisory Hub analysis."
      denied:
        - "Automatically call paid EvoMap tools, run periodic evolution, or spend credits."
        - "Publish, revoke, install, claim, submit, vote on, stake for, or otherwise mutate Hub assets or bounties without explicit current-turn authorization."
        - "Read arbitrary local files, secrets, project archives, or AGS memory through the hosted MCP."
        - "Override AGS lifecycle, task-card, execution-policy, release, review-gate, verification, or project-memory authority."
    retrieval_policy:
      default_sources:
        - "local_gep_assets"
        - "ags_project_evidence"
        - "evomap_hub_on_explicit_request"
      ranking:
        - "Prefer local user-owned Genes, Capsules, evidence, and AGS project memory over Hub results."
        - "Treat Hub assets as source-tagged advisory material; never as trusted project facts without validation."
        - "Use Premium biology and account analysis in the EvoMap web dashboard for cloud-asset health and lineage decisions."
      required_result_fields:
        - "source"
        - "type"
        - "id"
        - "summary"
        - "provenance"
        - "trust"
        - "cost"
    risk:
      level: "medium"
      findings:
        - "The hosted MCP is OAuth-authenticated and offers paid Hub operations alongside free local alternatives."
        - "Community assets and generated evolution plans can be stale, unverified, or misaligned with local governance."
        - "OAuth scopes and Hub operations must not become a path around AGS gates or explicit publication approval."
      mitigations:
        - "Route naturally for relevant requests, but state the exact credit cost before every paid invocation."
        - "Keep local gep/evolver_proxy as the first choice for local assets, evidence, and memory."
        - "Require explicit user authorization for any Hub mutation, publication, bounty action, or credit spend."
        - "Review policy changes in this registry; keep concrete host registration evidence machine-private."

  - name: "codegraph"
    routing:
      route_state: routable
      intent_tags: [code-intelligence, symbol-search, call-flow, change-impact]
      scope_tags: ["*"]
      mutation_surface: read-only
      requires_auth: false
      cost_class: local
      invoke_hint: "codegraph MCP"
      route_priority: 25
      capability_group: [code-intelligence]
      upstream_group: "colbymchenry/codegraph"
      examples:
        positive:
          - "这个函数是怎么一路调用到写入层的？"
          - "改这个模块会影响哪些调用方？"
        negative:
          - "帮我修改这个函数"
          - "查一下 React 最新文档"
    profile: "required"
    status: "active"
    category: "code_intelligence"
    trust_level: "reviewed_external"
    package:
      manager: "npm"
      name: "@colbymchenry/codegraph"
      version: "1.5.0"
      integrity: "sha512-/l1JMVOQ9WGQLrc/IIuAg7Igr944t79/oNCJTcnGkYtIeQx2XFIqI0ho+9Les/Yu4zKfmPU17hIUshD6yP1fKw=="
      repository: "https://github.com/colbymchenry/codegraph"
      license: "MIT"
    install:
      transport: "stdio"
      command: "codegraph"
      args:
        - "serve"
        - "--mcp"
      installed_clients:
        - "codex"
        - "claude-code"
      not_installed_clients:
        - "cursor"
      local_config_refs:
        - "codex:mcp__codegraph__ active in current session"
        - "claude-code:user-scope codegraph MCP entry"
        - "project:.codegraph/codegraph.db"
    authority:
      allowed:
        - "Provide local code intelligence over the current project index."
        - "Search symbols, callers, callees, impact radius, and indexed source context."
        - "Serve existing project index data over stdio MCP."
      denied:
        - "Override AGS protocol, task-card, execution-policy, review-gate, verification, release, or project-memory authority."
        - "Write project source files, task cards, receipts, governance logs, or AGS memory."
        - "Install or update packages without explicit human approval."
        - "Expose secrets, credentials, keychains, SSH keys, or private runtime tokens."
        - "Treat indexed code context as a replacement for compiler, test, or verification results."
    retrieval_policy:
      default_sources:
        - "local_project_index"
      required_result_fields:
        - "symbol"
        - "path"
        - "kind"
        - "source_context"
    risk:
      level: "medium"
      findings:
        - "Runs local stdio MCP with the host user's privileges."
        - "Can expose indexed source context from the active project to the parent agent."
        - "Index freshness depends on the local .codegraph database and watcher state."
      mitigations:
        - "Use only for local code intelligence; AGS remains the governance authority."
        - "Verify with `codegraph status .` before relying on index freshness."
        - "Require manual review before version bumps or enabling additional clients."
        - "Review and pin every version update in this registry."

  - name: "plugin:claude-mem:mcp-search"
    profile: "optional"
    status: "active"
    category: "session_memory_search"
    trust_level: "reviewed_external"
    routing:
      route_state: routable
      intent_tags: [memory-search, previous-session, continuity]
      scope_tags: ["*"]
      mutation_surface: read-only
      requires_auth: false
      cost_class: local
      invoke_hint: "claude-mem mcp-search (search -> timeline -> get_observations)"
      route_priority: 70
      examples:
        positive: ["找一下上次会话里我们为什么这样设计"]
        negative: ["读取当前仓库的 AGS 任务记忆"]
    package:
      manager: "claude-plugin"
      name: "claude-mem"
      version: "13.12.4"
      integrity: "sha256:82b8b652ed8e51f1b23ec7cd0580fd4757edfa7921dd81c78c8b566fb33045f1"
      repository: "https://github.com/thedotmack/claude-mem"
      license: "Apache-2.0"
    install:
      transport: "stdio"
      command: "node"
      args:
        - "plugin-managed mcp-server.cjs launcher"
      installed_clients:
        - "claude-code"
      not_installed_clients:
        - "codex"
        - "cursor"
      local_config_refs:
        - "claude-code:user-scope plugin claude-mem@thedotmack"
        - "claude-code:mcp list entry plugin:claude-mem:mcp-search"
        - "plugin-cache:~/.claude/plugins/cache/thedotmack/claude-mem/13.12.4/.mcp.json"
    authority:
      allowed:
        - "Search locally stored Claude-Mem observations by compact result IDs."
        - "Return timeline context around selected memory observations."
        - "Fetch full observations after filtering candidate IDs."
      denied:
        - "Override AGS protocol, task-card, execution-policy, review-gate, verification, release, or project-memory authority."
        - "Store or expose secrets, credentials, private runtime tokens, keychains, SSH keys, or protected memory capsules."
        - "Install, repair, update, or remove plugins without explicit human approval."
        - "Treat memory observations as verified current facts without fresh verification."
    retrieval_policy:
      default_sources:
        - "local_claude_mem_database"
      ranking:
        - "Use Claude-Mem as continuity evidence for previous sessions only."
        - "Prefer AGS receipts, task memory, and current verification results when they conflict with Claude-Mem observations."
      required_result_fields:
        - "id"
        - "timestamp"
        - "project"
        - "title"
        - "observation_type"
    risk:
      level: "medium"
      findings:
        - "Runs plugin-provided local stdio MCP with the host user's privileges."
        - "Memory search can expose summaries of prior local sessions to the parent agent."
        - "The worker/hooks may write to Claude-Mem's local data directory outside this repository."
      mitigations:
        - "Keep AGS as the governance authority and Claude-Mem as advisory continuity memory."
        - "Use progressive disclosure: search, timeline, then fetch selected observations."
        - "Do not send secrets or protected AGS memory into Claude-Mem."
        - "Pin the observed plugin version and require manual review before updates."

# ── Internal-entrypoint route targets (registry-only) ───────────────────────────
# MCP tool + CLI-subcommand entrypoints. Per the parent/entrypoint model these
# are NOT top-level `mcps:` servers and NOT suite.required skills: they are
# registry-only route targets whose routing.parent points at a real host-visible
# body (the MCP server / CLI-backed capability). build_inventory synthesizes a
# route-target row; deterministic resolution dereferences availability to the parent
# and surfaces the entrypoint label. They produce NO host-visible expectation and
# never enter sync / apply / propose.
route_targets:
  # context7 MCP tools (parent kind: mcp). The tool entrypoint outranks the
  # context7 server for docs-lookup so the route surfaces entrypoint=get-library-docs
  # while `primary` still derefs to the real host-visible context7 server.
  - name: "context7:get-library-docs"
    description: context7 MCP get-library-docs tool (docs-lookup route target)
    routing:
      route_state: routable
      parent: { kind: mcp, name: context7 }
      entrypoint: { kind: tool, name: get-library-docs }
      intent_tags: [docs-lookup]
      scope_tags: ["*"]
      mutation_surface: read-only
      requires_auth: false
      cost_class: network
      invoke_hint: "context7 MCP get-library-docs"
      route_priority: 28
      capability_group: [documentation-context]
      upstream_group: "upstash/context7"
      examples:
        positive: ["查一下这个库的最新文档", "how do I use the X library API"]
        negative: ["把这个文档发邮件给张三"]
  - name: "context7:resolve-library-id"
    description: context7 MCP resolve-library-id tool (secondary docs route target)
    routing:
      route_state: routable
      parent: { kind: mcp, name: context7 }
      entrypoint: { kind: tool, name: resolve-library-id }
      intent_tags: [docs-lookup]
      scope_tags: ["*"]
      mutation_surface: read-only
      requires_auth: false
      cost_class: network
      invoke_hint: "context7 MCP resolve-library-id"
      route_priority: 40
      capability_group: [documentation-context]
      upstream_group: "upstash/context7"
      examples:
        positive: ["查一下这个库的文档", "library docs"]
        negative: ["把这个文档发邮件给张三"]
  # CLI-backed subcommand entrypoint (parent kind: cli-backed). lark-cli is a
  # REFERENCE-ONLY boundary capability (protocol/skill-governance.md §技能边界):
  # this is routing metadata ONLY — AGS does not adopt lark, does not write any
  # host config, and never runs lark-cli. lark-cli's real availability is degraded
  # (external, unmanaged), so this route stays advisory — proving the parent-deref
  # is fail-closed for a degraded cli-backed parent.
  - name: "lark-cli:mail-send"
    description: lark-cli mail send subcommand (mail-send route target; reference-only)
    routing:
      route_state: routable
      parent: { kind: cli-backed, name: lark-cli }
      entrypoint: { kind: subcommand, name: mail-send }
      intent_tags: [mail-send]
      scope_tags: ["*"]
      mutation_surface: external-write
      requires_auth: true
      auth_kind: feishu-account
      cost_class: network
      invoke_hint: "lark-cli mail send"
      route_priority: 60
      capability_group: [lark-collab]
      upstream_group: "feishu/lark-cli"
      examples:
        positive: ["通过飞书 CLI 给张三发送邮件"]
        negative: ["在飞书群里给张三发消息"]
