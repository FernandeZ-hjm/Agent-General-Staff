    # The host submits a typed HostRouteProposal. Skill Resolver validates exact
    # SkillTarget identifiers against the machine-local HostCapabilitySnapshot;
    # it does not interpret natural language or select fallbacks. Internal
    # Superpowers playbooks remain entrypoints of the host-visible parent skill.
    # ags-capability is also retired as a Codex front-stage command skill; the
    # public `ags capability ...` CLI remains available for Cross-Agent
    # visibility/sync and is not exposed as a `$ags-capability` skill.
